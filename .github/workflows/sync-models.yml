name: Sync UCP Models

on:
  repository_dispatch:
    types: [ucp-schemas-updated]
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      ucp_ref:
        description: "UCP branch ref to sync (main or release/YYYY-MM-DD)"
        required: false
        default: "main"
        type: string
      ucp_sha:
        description: "Optional 40-char UCP commit SHA (defaults to HEAD of ucp_ref)"
        required: false
        default: ""
        type: string
      force_resync:
        description: "Bypass ancestor and zero-diff checks"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  prepare:
    name: Discover target UCP refs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      refs: ${{ steps.discover.outputs.refs }}
    steps:
      - name: Resolve target refs for synchronization
        id: discover
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_REF: ${{ github.event.client_payload.ucp_ref }}
          INPUT_REF: ${{ inputs.ucp_ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            TARGET_REF="${DISPATCH_REF:-main}"
            REFS_JSON="$(jq -cn --arg ref "$TARGET_REF" '[$ref]')"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TARGET_REF="${INPUT_REF:-main}"
            REFS_JSON="$(jq -cn --arg ref "$TARGET_REF" '[$ref]')"
          else
            REFS=("main")
            REMOTE_HEADS="$(git ls-remote --heads "https://github.com/${REPOSITORY}.git" "refs/heads/release/*" | awk '{print $2}' | sort)"
            while IFS= read -r full_ref; do
              [[ -z "$full_ref" ]] && continue
              rel_branch="${full_ref#refs/heads/}"
              if [[ "$rel_branch" =~ ^release/([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
                YYYY="${BASH_REMATCH[1]}"
                MM="${BASH_REMATCH[2]}"
                DD="${BASH_REMATCH[3]}"
                YYYYMMDD="${YYYY}${MM}${DD}"
                if (( 10#$YYYYMMDD >= 20260825 )) && date -u -d "${YYYY}-${MM}-${DD}" "+%Y-%m-%d" >/dev/null 2>&1; then
                  if [[ "$(date -u -d "${YYYY}-${MM}-${DD}" "+%Y-%m-%d")" == "${YYYY}-${MM}-${DD}" ]]; then
                    REFS+=("$rel_branch")
                  fi
                fi
              fi
            done <<< "$REMOTE_HEADS"
            REFS_JSON="$(printf '%s\n' "${REFS[@]}" | jq -R . | jq -cs .)"
          fi
          echo "refs=${REFS_JSON}" >> "$GITHUB_OUTPUT"

  sync:
    name: Synchronize UCP Zod models (${{ matrix.ucp_ref }})
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        ucp_ref: ${{ fromJson(needs.prepare.outputs.refs) }}
    concurrency:
      group: sync-models-${{ matrix.ucp_ref }}
      cancel-in-progress: true
    steps:
      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Resolve target branch and UCP spec commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MATRIX_REF: ${{ matrix.ucp_ref }}
          DISPATCH_SHA: ${{ github.event.client_payload.ucp_sha }}
          INPUT_SHA: ${{ inputs.ucp_sha }}
          FORCE_RESYNC: ${{ inputs.force_resync }}
        run: |
          set -euo pipefail
          UCP_REF="$MATRIX_REF"
          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            REQUESTED_SHA="${DISPATCH_SHA:-}"
          elif [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            REQUESTED_SHA="${INPUT_SHA:-}"
          else
            REQUESTED_SHA=""
          fi

          if [[ "$UCP_REF" == "main" ]]; then
            TARGET_BRANCH="main"
            CHANNEL="draft"
            SAFE_TARGET="main"
          elif [[ "$UCP_REF" =~ ^release/([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
            YYYY="${BASH_REMATCH[1]}"
            MM="${BASH_REMATCH[2]}"
            DD="${BASH_REMATCH[3]}"
            if ! YYYY="$YYYY" MM="$MM" DD="$DD" node -e 'const y=+process.env.YYYY,m=+process.env.MM,d=+process.env.DD,dt=new Date(Date.UTC(y,m-1,d)); process.exit(dt.getUTCFullYear()===y && dt.getUTCMonth()+1===m && dt.getUTCDate()===d ? 0 : 1)'; then
              echo "::error::Invalid calendar date in ucp_ref '${UCP_REF}'"
              exit 1
            fi
            YYYYMMDD="${YYYY}${MM}${DD}"
            if (( 10#$YYYYMMDD < 20260825 )); then
              echo "Skipping legacy release branch ${UCP_REF} (< 2026-08-25)."
              exit 0
            fi
            TARGET_BRANCH="$UCP_REF"
            CHANNEL="release"
            SAFE_TARGET="release-${YYYY}-${MM}-${DD}"
          else
            echo "::error::Unsupported ucp_ref '${UCP_REF}'"
            exit 1
          fi

          if [[ "$TARGET_BRANCH" != "main" ]] && ! git show-ref --verify --quiet "refs/remotes/origin/${TARGET_BRANCH}"; then
            echo "::notice::Target branch ${TARGET_BRANCH} does not exist yet in ${REPOSITORY}; filing release-cut-needed issue."
            UPSTREAM_SHA="$REQUESTED_SHA"
            if [[ -z "$UPSTREAM_SHA" ]]; then
              UPSTREAM_SHA="$(git ls-remote https://github.com/Universal-Commerce-Protocol/ucp.git "refs/heads/${UCP_REF}" | awk '{print $1}')"
            fi
            if [[ -n "${GITHUB_ENV:-}" && -n "$UPSTREAM_SHA" ]]; then
              echo "NEW_SHA=${UPSTREAM_SHA}" >> "$GITHUB_ENV"
            fi
            gh label create "release-cut-needed" --repo "$REPOSITORY" --color "d93f0b" \
              --description "UCP release branch requires initial SDK release cut" --force || true
            ISSUE_TITLE="chore(release): cut ${TARGET_BRANCH} for UCP specification release"
            ISSUE_JSON="$(gh issue list --repo "$REPOSITORY" --state open --label "release-cut-needed" \
              --search "in:title ${TARGET_BRANCH}" --json number,title,body,comments)"
            EXISTING_ISSUE="$(ISSUE_TITLE="$ISSUE_TITLE" jq -r '.[] | select(.title == env.ISSUE_TITLE) | .number' <<< "$ISSUE_JSON" | head -n 1)"
            ISSUE_BODY="Upstream UCP branch \`${UCP_REF}\` (commit \`${UPSTREAM_SHA:-unknown}\`) received an update, but \`${TARGET_BRANCH}\` has not been cut in \`${REPOSITORY}\` yet. Run the \`Cut SDK Release\` workflow (\`cut-sdk-release.yml\`) with \`spec_version=${TARGET_BRANCH#release/}\` and \`bump=initial\`."
            if [[ -n "$EXISTING_ISSUE" ]]; then
              ALREADY_MENTIONED="false"
              if [[ -n "$UPSTREAM_SHA" ]]; then
                ALREADY_MENTIONED="$(ISSUE_TITLE="$ISSUE_TITLE" UPSTREAM_SHA="$UPSTREAM_SHA" jq -r '
                  .[] | select(.title == env.ISSUE_TITLE) |
                  if ((.body // "") | contains(env.UPSTREAM_SHA)) or (((.comments[-1].body) // "") | contains(env.UPSTREAM_SHA))
                  then "true" else "false" end
                ' <<< "$ISSUE_JSON" | head -n 1)"
              fi
              if [[ "$ALREADY_MENTIONED" == "true" ]]; then
                echo "Open issue #${EXISTING_ISSUE} already mentions ${UPSTREAM_SHA}; skipping duplicate comment."
              else
                gh issue comment "$EXISTING_ISSUE" --repo "$REPOSITORY" --body "$ISSUE_BODY"
              fi
            else
              gh issue create --repo "$REPOSITORY" \
                --label "release-cut-needed" \
                --title "$ISSUE_TITLE" \
                --body "$ISSUE_BODY"
            fi
            exit 0
          fi

          ROLLING_BRANCH="chore/sync-models-${SAFE_TARGET}"
          ROLLING_REF="refs/remotes/origin/${ROLLING_BRANCH}"
          git checkout -B "$ROLLING_BRANCH" "origin/${TARGET_BRANCH}"
          if [ ! -f ucp-lock.json ]; then echo "ucp-lock.json not present yet; skipping"; exit 0; fi

          OLD_SHA="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_sha")"
          UCP_SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_schema_version")"
          if [[ ! "$OLD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ucp-lock.json ucp_sha '${OLD_SHA}' is not a valid 40-character lowercase hex SHA"
            exit 1
          fi
          if [[ ! "$UCP_SCHEMA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ucp-lock.json ucp_schema_version '${UCP_SCHEMA_VERSION}' is not a valid semantic version"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ucp-spec"
          git clone --filter=blob:none --no-checkout https://github.com/Universal-Commerce-Protocol/ucp.git "$RUNNER_TEMP/ucp-spec"
          if ! git -C "$RUNNER_TEMP/ucp-spec" show-ref --verify --quiet "refs/remotes/origin/${UCP_REF}"; then
            echo "::error::Upstream branch ${UCP_REF} does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi
          if [[ -n "$REQUESTED_SHA" ]]; then
            NEW_SHA="$REQUESTED_SHA"
          else
            NEW_SHA="$(git -C "$RUNNER_TEMP/ucp-spec" rev-parse "origin/${UCP_REF}")"
          fi

          if [[ ! "$NEW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Resolved ucp_sha '${NEW_SHA}' is not a valid 40-character lowercase hex SHA"
            exit 1
          fi
          if ! git -C "$RUNNER_TEMP/ucp-spec" cat-file -e "${NEW_SHA}^{commit}" 2>/dev/null; then
            echo "::error::ucp_sha '${NEW_SHA}' does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi
          if ! git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$NEW_SHA" "origin/${UCP_REF}"; then
            echo "::error::ucp_sha '${NEW_SHA}' is not an ancestor of origin/${UCP_REF}"
            exit 1
          fi

          OPEN_ROLLING_PR="$(gh pr list --repo "$REPOSITORY" --state open --head "$ROLLING_BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number // empty')"
          ROLLING_SHA=""
          ROLLING_COVERED_BY_NEW="false"
          if git show-ref --verify --quiet "$ROLLING_REF"; then
            ROLLING_LOCK="$(git show "${ROLLING_REF}:ucp-lock.json" 2>/dev/null || true)"
            if [[ -n "$ROLLING_LOCK" ]]; then
              CANDIDATE_ROLLING_SHA="$(LOCK_JSON="$ROLLING_LOCK" node -p "JSON.parse(process.env.LOCK_JSON).ucp_sha || ''" 2>/dev/null || true)"
              if [[ "$CANDIDATE_ROLLING_SHA" =~ ^[0-9a-f]{40}$ ]] && git -C "$RUNNER_TEMP/ucp-spec" cat-file -e "${CANDIDATE_ROLLING_SHA}^{commit}" 2>/dev/null; then
                ROLLING_SHA="$CANDIDATE_ROLLING_SHA"
                if git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$ROLLING_SHA" "$NEW_SHA"; then
                  ROLLING_COVERED_BY_NEW="true"
                fi
              fi
            fi
          fi

          if [[ -n "${GITHUB_ENV:-}" ]]; then
            {
              echo "UCP_REF=${UCP_REF}"
              echo "TARGET_BRANCH=${TARGET_BRANCH}"
              echo "SAFE_TARGET=${SAFE_TARGET}"
              echo "CHANNEL=${CHANNEL}"
              echo "OLD_SHA=${OLD_SHA}"
              echo "NEW_SHA=${NEW_SHA}"
              echo "UCP_SCHEMA_VERSION=${UCP_SCHEMA_VERSION}"
              echo "OPEN_ROLLING_PR=${OPEN_ROLLING_PR}"
              echo "ROLLING_COVERED_BY_NEW=${ROLLING_COVERED_BY_NEW}"
            } >> "$GITHUB_ENV"
          fi

          if [[ "$OLD_SHA" == "$NEW_SHA" && "${FORCE_RESYNC:-false}" != "true" ]]; then
            echo "ucp-lock.json already pinned to ${NEW_SHA}; nothing to sync."
            if [[ -n "$OPEN_ROLLING_PR" && "$ROLLING_COVERED_BY_NEW" == "true" && -n "${GITHUB_ENV:-}" ]]; then
              echo "CLOSE_STALE_PR=true" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          if [[ "${FORCE_RESYNC:-false}" != "true" ]]; then
            ANCESTOR_RC=0
            git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$OLD_SHA" "$NEW_SHA" || ANCESTOR_RC=$?
            if (( ANCESTOR_RC == 1 )); then
              echo "::notice::Incoming ucp_sha ${NEW_SHA} is not a descendant of locked ${OLD_SHA}; skipping out-of-order dispatch."
              exit 0
            elif (( ANCESTOR_RC != 0 )); then
              echo "::error::Failed to verify ancestry between locked '${OLD_SHA}' and '${NEW_SHA}' (exit code ${ANCESTOR_RC})"
              exit "$ANCESTOR_RC"
            fi

            if [[ -n "$OPEN_ROLLING_PR" && -n "$ROLLING_SHA" ]] && git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "$ROLLING_REF"; then
              if git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$NEW_SHA" "$ROLLING_SHA"; then
                echo "::notice::Incoming ucp_sha ${NEW_SHA} is already covered by open PR #${OPEN_ROLLING_PR} on ${ROLLING_BRANCH} (${ROLLING_SHA}); skipping."
                exit 0
              fi
            fi
          fi

          git -C "$RUNNER_TEMP/ucp-spec" checkout --quiet "$NEW_SHA"
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            echo "SYNC_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Install Python
        if: env.SYNC_READY == 'true'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Install dependencies and ucp-schema
        if: env.SYNC_READY == 'true'
        env:
          UCP_SCHEMA_VERSION: ${{ env.UCP_SCHEMA_VERSION }}
        run: |
          set -euo pipefail
          npm ci
          TMP_BIN="$(mktemp -d)"
          trap 'rm -rf "$TMP_BIN"' EXIT
          curl -fsSL --retry 3 -o "$TMP_BIN/ucp-schema-linux-x86_64" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$TMP_BIN/SHA256SUMS" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate models
        if: env.SYNC_READY == 'true'
        env:
          CHANNEL: ${{ env.CHANNEL }}
          UCP_REF: ${{ env.UCP_REF }}
        run: |
          set -euo pipefail
          ./generate_models.sh "$RUNNER_TEMP/ucp-spec" --spec-dir "$RUNNER_TEMP/ucp-spec" --channel "$CHANNEL" --ref "$UCP_REF" --write-lock

      - name: Normalize with repository pre-commit Prettier hook
        if: env.SYNC_READY == 'true'
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: prettier --files src/spec_generated.ts ucp-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Check model diff and run verification suite
        if: env.SYNC_READY == 'true'
        env:
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          SAFE_TARGET: ${{ env.SAFE_TARGET }}
          OPEN_ROLLING_PR: ${{ env.OPEN_ROLLING_PR }}
          ROLLING_COVERED_BY_NEW: ${{ env.ROLLING_COVERED_BY_NEW }}
          FORCE_RESYNC: ${{ inputs.force_resync }}
        run: |
          set -euo pipefail
          npx prettier --check ucp-lock.json

          if [[ "${FORCE_RESYNC:-false}" != "true" ]] && git diff --quiet "origin/${TARGET_BRANCH}" -- src/spec_generated.ts; then
            echo "src/spec_generated.ts is unchanged against origin/${TARGET_BRANCH}; skipping lockfile-only PR."
            if [[ -n "$OPEN_ROLLING_PR" && "$ROLLING_COVERED_BY_NEW" == "true" && -n "${GITHUB_ENV:-}" ]]; then
              echo "CLOSE_STALE_PR=true" >> "$GITHUB_ENV"
            fi
            exit 0
          fi

          ROLLING_REF="refs/remotes/origin/chore/sync-models-${SAFE_TARGET}"
          if [[ "${FORCE_RESYNC:-false}" != "true" && -n "$OPEN_ROLLING_PR" ]] && git show-ref --verify --quiet "$ROLLING_REF" && git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "$ROLLING_REF"; then
            if git diff --quiet "$ROLLING_REF" -- src/spec_generated.ts; then
              echo "src/spec_generated.ts is unchanged relative to open PR #${OPEN_ROLLING_PR}; skipping lockfile-only force-push."
              exit 0
            fi
          fi

          npm run build
          npm test
          if [[ -n "${GITHUB_ENV:-}" ]]; then
            echo "PR_READY=true" >> "$GITHUB_ENV"
          fi

      - name: Generate GitHub App Token
        if: env.PR_READY == 'true' || env.CLOSE_STALE_PR == 'true'
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Close stale rolling PR
        if: env.CLOSE_STALE_PR == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          NEW_SHA: ${{ env.NEW_SHA }}
          OPEN_ROLLING_PR: ${{ env.OPEN_ROLLING_PR }}
        run: |
          set -euo pipefail
          gh pr close "$OPEN_ROLLING_PR" --repo "$REPOSITORY" --delete-branch \
            --comment "Closing superseded sync pull request because \`src/spec_generated.ts\` at upstream commit \`${NEW_SHA}\` now matches \`${TARGET_BRANCH}\`."

      - name: Push rolling branch and open or update Stage 1 PR
        if: env.PR_READY == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          TARGET_BRANCH: ${{ env.TARGET_BRANCH }}
          SAFE_TARGET: ${{ env.SAFE_TARGET }}
          UCP_REF: ${{ env.UCP_REF }}
          CHANNEL: ${{ env.CHANNEL }}
          OLD_SHA: ${{ env.OLD_SHA }}
          NEW_SHA: ${{ env.NEW_SHA }}
        run: |
          set -euo pipefail
          SHORT_SHA="${NEW_SHA:0:7}"
          PR_BRANCH="chore/sync-models-${SAFE_TARGET}"
          PR_TITLE="chore(models): sync UCP schemas to ${SHORT_SHA}"
          PR_BODY="Automated Stage 1 model synchronization from \`Universal-Commerce-Protocol/ucp\` (\`${UCP_REF}\`, channel \`${CHANNEL}\`).

          - Previous UCP commit: \`${OLD_SHA}\`
          - Updated UCP commit: \`${NEW_SHA}\`
          - Upstream compare: https://github.com/Universal-Commerce-Protocol/ucp/compare/${OLD_SHA}...${NEW_SHA}"

          BOT_NAME="${APP_SLUG:-ucp-automation}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          if [[ ! "$BOT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to resolve numeric GitHub user ID for ${BOT_NAME}"
            exit 1
          fi
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"
          git add -- ucp-lock.json src/spec_generated.ts
          if git diff --cached --quiet; then
            echo "No staged changes to commit; exiting cleanly."
            exit 0
          fi
          git commit -m "$PR_TITLE"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/${PR_BRANCH}"

          EXISTING_PR="$(gh pr list --repo "$REPOSITORY" --state open --head "$PR_BRANCH" --base "$TARGET_BRANCH" --json number --jq '.[0].number // empty')"
          if [[ -n "$EXISTING_PR" ]]; then
            gh pr edit "$EXISTING_PR" --repo "$REPOSITORY" --title "$PR_TITLE" --body "$PR_BODY"
          else
            gh pr create --repo "$REPOSITORY" --base "$TARGET_BRANCH" --head "$PR_BRANCH" --title "$PR_TITLE" --body "$PR_BODY"
          fi

      - name: Report sync failure via deduplicated issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          UCP_REF: ${{ env.UCP_REF || matrix.ucp_ref || github.event.client_payload.ucp_ref || inputs.ucp_ref || 'main' }}
          NEW_SHA: ${{ env.NEW_SHA || github.event.client_payload.ucp_sha || inputs.ucp_sha || 'unknown' }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          gh label create "codegen-sync-failure" --repo "$REPOSITORY" --color "b60205" \
            --description "Automated UCP schema model sync failure" --force || true
          ISSUE_TITLE="ci(sync): model synchronization failed (${UCP_REF})"
          ISSUE_JSON="$(gh issue list --repo "$REPOSITORY" --state open --label "codegen-sync-failure" \
            --search "in:title (${UCP_REF})" --json number,title,body,comments)"
          EXISTING_ISSUE="$(ISSUE_TITLE="$ISSUE_TITLE" jq -r '.[] | select(.title == env.ISSUE_TITLE) | .number' <<< "$ISSUE_JSON" | head -n 1)"
          FAILURE_BODY="Automated model synchronization failed for \`${UCP_REF}\` at commit \`${NEW_SHA}\`.

          - Workflow run: ${RUN_URL}"
          if [[ -n "$EXISTING_ISSUE" ]]; then
            ALREADY_MENTIONED="false"
            if [[ "$NEW_SHA" != "unknown" && -n "$NEW_SHA" ]]; then
              ALREADY_MENTIONED="$(ISSUE_TITLE="$ISSUE_TITLE" NEW_SHA="$NEW_SHA" jq -r '
                .[] | select(.title == env.ISSUE_TITLE) |
                if ((.body // "") | contains(env.NEW_SHA)) or (((.comments[-1].body) // "") | contains(env.NEW_SHA))
                then "true" else "false" end
              ' <<< "$ISSUE_JSON" | head -n 1)"
            fi
            if [[ "$ALREADY_MENTIONED" == "true" ]]; then
              echo "Open failure issue #${EXISTING_ISSUE} already mentions ${NEW_SHA}; skipping duplicate comment."
            else
              gh issue comment "$EXISTING_ISSUE" --repo "$REPOSITORY" --body "$FAILURE_BODY"
            fi
          else
            gh issue create --repo "$REPOSITORY" \
              --label "codegen-sync-failure" \
              --title "$ISSUE_TITLE" \
              --body "$FAILURE_BODY"
          fi
