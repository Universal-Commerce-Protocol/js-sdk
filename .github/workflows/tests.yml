name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install dependencies and run unit tests
        run: |
          npm ci
          npm test

  model-drift:
    name: Committed models match regeneration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Read ucp-lock.json
        id: lock
        run: |
          set -euo pipefail
          UCP_SHA="$(jq -er '.ucp_sha | select(type == "string" and test("^[0-9a-f]{40}$"))' ucp-lock.json)"
          UCP_SCHEMA_VERSION="$(jq -er '.ucp_schema_version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' ucp-lock.json)"
          {
            echo "ucp_sha=${UCP_SHA}"
            echo "ucp_schema_version=${UCP_SCHEMA_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned UCP spec
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Universal-Commerce-Protocol/ucp
          ref: ${{ steps.lock.outputs.ucp_sha }}
          path: .ucp-spec
          persist-credentials: false

      - name: Regenerate models and verify zero drift
        env:
          UCP_SCHEMA_VERSION: ${{ steps.lock.outputs.ucp_schema_version }}
        run: |
          set -euo pipefail
          npm ci
          TMP_BIN="$(mktemp -d)"
          trap 'rm -rf "$TMP_BIN"' EXIT
          BASE_URL="https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}"
          curl -fsSL --retry 3 -o "$TMP_BIN/ucp-schema-linux-x86_64" "$BASE_URL/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$TMP_BIN/SHA256SUMS" "$BASE_URL/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$TMP_BIN/ucp-schema"

          UCP_SCHEMA_BIN="$TMP_BIN/ucp-schema" ./generate_models.sh --from-lock --spec-dir .ucp-spec
          PRE_COMMIT=(pipx run pre-commit)
          if command -v uvx >/dev/null 2>&1; then PRE_COMMIT=(uvx pre-commit); fi
          "${PRE_COMMIT[@]}" run prettier --files src/spec_generated.ts ucp-lock.json || \
            "${PRE_COMMIT[@]}" run prettier --files src/spec_generated.ts ucp-lock.json

          if [[ -n "$(git status --porcelain -- src/spec_generated.ts ucp-lock.json)" ]]; then
            git diff -- src/spec_generated.ts ucp-lock.json || true
            echo "::error::src/spec_generated.ts or ucp-lock.json differs from lockfile regeneration."
            exit 1
          fi
