name: Tests

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  # Job 1: run the unit tests in tests/*.test.js.
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # Job 2: assert the committed models equal a fresh regeneration from the
  # commit-pinned UCP spec SHA recorded in ucp-lock.json.
  model-drift:
    name: Committed models match regeneration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"

      - name: Read ucp-lock.json
        id: lock
        run: |
          set -euo pipefail
          UCP_SHA="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_sha")"
          UCP_SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_schema_version")"
          {
            echo "ucp_sha=${UCP_SHA}"
            echo "ucp_schema_version=${UCP_SCHEMA_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout the pinned UCP spec
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: Universal-Commerce-Protocol/ucp
          ref: ${{ steps.lock.outputs.ucp_sha }}
          path: .ucp-spec
          persist-credentials: false

      # pre-commit/action bootstraps pre-commit via pip, so Python must be
      # present (matches linter.yml, which pairs setup-python with the hook).
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      # json-schema-to-zod and typescript are locked by package-lock.json, so
      # `npm ci` pins the generator toolchain deterministically.
      - name: Install dependencies
        run: npm ci

      - name: Install ucp-schema
        env:
          UCP_SCHEMA_VERSION: ${{ steps.lock.outputs.ucp_schema_version }}
        run: |
          set -euo pipefail
          TMP_BIN="$(mktemp -d)"
          curl -fsSL -o "$TMP_BIN/ucp-schema-linux-x86_64" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/ucp-schema-linux-x86_64"
          curl -fsSL -o "$TMP_BIN/SHA256SUMS" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$TMP_BIN"

      - name: Regenerate models from the pinned spec
        run: ./generate_models.sh --from-lock --spec-dir .ucp-spec

      - name: Normalize (prettier, via the repo's pinned pre-commit hook)
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: prettier --files src/spec_generated.ts ucp-lock.json
        env:
          # workaround for pre-commit/action not being updated to node24
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Fail if committed models differ from regeneration
        run: |
          if ! git diff --exit-code -- src/spec_generated.ts ucp-lock.json; then
            echo "::error::src/spec_generated.ts or ucp-lock.json is out of sync with the commit pinned in ucp-lock.json. Regenerate with './generate_models.sh --from-lock', run pre-commit to format, and commit src/spec_generated.ts."
            exit 1
          fi
          echo "Committed models match regeneration from ucp-lock.json."
