name: Release
on:
  release:
    types: [published]
permissions:
  contents: read

concurrency:
  group: npm-release-publish
  cancel-in-progress: false

jobs:
  release:
    name: Upload release to NPM
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: "release"
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Verify release tag, manifest version, lockfile, and branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]{4})([0-9]{2})([0-9]{2})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Release tag '$RELEASE_TAG' must match canonical vYYYYMMDD.MINOR.PATCH"
            exit 1
          fi
          YYYY="${BASH_REMATCH[1]}"
          MM="${BASH_REMATCH[2]}"
          DD="${BASH_REMATCH[3]}"
          MINOR="${BASH_REMATCH[4]}"
          PATCH="${BASH_REMATCH[5]}"
          if ! YYYY="$YYYY" MM="$MM" DD="$DD" node -e 'const y=+process.env.YYYY,m=+process.env.MM,d=+process.env.DD,dt=new Date(Date.UTC(y,m-1,d)); process.exit(dt.getUTCFullYear()===y && dt.getUTCMonth()+1===m && dt.getUTCDate()===d ? 0 : 1)'; then
            echo "::error::Release tag '$RELEASE_TAG' does not contain a valid calendar date (${YYYY}-${MM}-${DD})"
            exit 1
          fi
          YYYYMMDD="${YYYY}${MM}${DD}"
          if (( 10#$YYYYMMDD < 20260825 )); then
            echo "::error::CalVer release epoch $YYYYMMDD must be >= 20260825"
            exit 1
          fi
          EXPECTED_VERSION="${YYYYMMDD}.${MINOR}.${PATCH}"
          EXPECTED_BRANCH="release/${YYYY}-${MM}-${DD}"

          PKG_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
          if [[ "$PKG_VERSION" == 0.0.0* ]]; then
            echo "::error::Refusing to publish draft package.json version '$PKG_VERSION'"
            exit 1
          fi
          if [[ "$PKG_VERSION" != "$EXPECTED_VERSION" ]]; then
            echo "::error::package.json version '$PKG_VERSION' does not match tag version '$EXPECTED_VERSION'"
            exit 1
          fi

          if [[ ! -f ucp-lock.json ]]; then
            echo "::error::ucp-lock.json is missing"
            exit 1
          fi
          LOCK_CHANNEL="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).channel")"
          LOCK_REF="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_ref")"
          LOCK_SHA="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_sha")"
          UCP_SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_schema_version")"
          if [[ "$LOCK_CHANNEL" != "release" || "$LOCK_REF" != "$EXPECTED_BRANCH" ]]; then
            echo "::error::ucp-lock.json must have channel='release' and ucp_ref='$EXPECTED_BRANCH' (got channel='$LOCK_CHANNEL', ucp_ref='$LOCK_REF')"
            exit 1
          fi
          if [[ ! "$LOCK_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::ucp-lock.json ucp_sha '$LOCK_SHA' must be a 40-character lowercase hex SHA"
            exit 1
          fi
          if [[ ! "$UCP_SCHEMA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ucp-lock.json ucp_schema_version '$UCP_SCHEMA_VERSION' must be a canonical semantic version"
            exit 1
          fi

          git fetch origin "+refs/heads/${EXPECTED_BRANCH}:refs/remotes/origin/${EXPECTED_BRANCH}"
          if ! git merge-base --is-ancestor HEAD "origin/${EXPECTED_BRANCH}"; then
            echo "::error::Release commit $(git rev-parse HEAD) is not an ancestor of origin/${EXPECTED_BRANCH}"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ucp-spec"
          git clone --filter=blob:none --no-checkout https://github.com/Universal-Commerce-Protocol/ucp.git "$RUNNER_TEMP/ucp-spec"
          if ! git -C "$RUNNER_TEMP/ucp-spec" show-ref --verify --quiet "refs/remotes/origin/${EXPECTED_BRANCH}"; then
            echo "::error::Upstream branch ${EXPECTED_BRANCH} does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi
          if ! git -C "$RUNNER_TEMP/ucp-spec" cat-file -e "${LOCK_SHA}^{commit}" 2>/dev/null; then
            echo "::error::ucp-lock.json ucp_sha '$LOCK_SHA' does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi
          if ! git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$LOCK_SHA" "origin/${EXPECTED_BRANCH}"; then
            echo "::error::ucp-lock.json ucp_sha '$LOCK_SHA' is not an ancestor of upstream origin/${EXPECTED_BRANCH}"
            exit 1
          fi
          git -C "$RUNNER_TEMP/ucp-spec" checkout --quiet "$LOCK_SHA"

          if [[ -n "${GITHUB_ENV:-}" ]]; then
            {
              echo "YYYY=${YYYY}"
              echo "MM=${MM}"
              echo "DD=${DD}"
              echo "YYYYMMDD=${YYYYMMDD}"
              echo "EXPECTED_VERSION=${EXPECTED_VERSION}"
              echo "UCP_SCHEMA_VERSION=${UCP_SCHEMA_VERSION}"
            } >> "$GITHUB_ENV"
          fi

      - name: Install dependencies
        run: npm ci

      - name: Install ucp-schema
        env:
          UCP_SCHEMA_VERSION: ${{ env.UCP_SCHEMA_VERSION }}
        run: |
          set -euo pipefail
          TMP_BIN="$(mktemp -d)"
          trap 'rm -rf "$TMP_BIN"' EXIT
          curl -fsSL --retry 3 -o "$TMP_BIN/ucp-schema-linux-x86_64" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$TMP_BIN/SHA256SUMS" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate models from lockfile
        run: ./generate_models.sh --from-lock --spec-dir "$RUNNER_TEMP/ucp-spec"

      - name: Normalize with repository pre-commit Prettier hook
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: prettier --files src/spec_generated.ts ucp-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Verify model drift and run unit tests
        run: |
          set -euo pipefail
          if [[ -n "$(git status --porcelain -- src/spec_generated.ts package.json ucp-lock.json)" ]]; then
            git diff -- src/spec_generated.ts package.json ucp-lock.json || true
            echo "::error::Committed release models or manifest differ from deterministic lockfile regeneration"
            exit 1
          fi
          npm run build
          npm test

      - name: Build and publish to NPM
        env:
          YYYY: ${{ env.YYYY }}
          MM: ${{ env.MM }}
          DD: ${{ env.DD }}
          YYYYMMDD: ${{ env.YYYYMMDD }}
          EXPECTED_VERSION: ${{ env.EXPECTED_VERSION }}
        run: |
          set -euo pipefail
          npm install -g --ignore-scripts "npm@^11.21.0"
          npm run build
          NPM_VIEW_ERR="$(mktemp)"
          if CURRENT_LATEST="$(npm view @ucp-js/sdk dist-tags.latest 2>"$NPM_VIEW_ERR")"; then
            rm -f "$NPM_VIEW_ERR"
          elif grep -Eq '^npm (error|ERR!) code E404\b' "$NPM_VIEW_ERR"; then
            CURRENT_LATEST=""
            rm -f "$NPM_VIEW_ERR"
          else
            cat "$NPM_VIEW_ERR" >&2
            rm -f "$NPM_VIEW_ERR"
            echo "::error::Failed to query npm dist-tags.latest for @ucp-js/sdk; aborting to prevent unsafe latest tag overwrite"
            exit 1
          fi
          if [[ "$CURRENT_LATEST" =~ ^([0-9]{8})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            LATEST_EPOCH="${BASH_REMATCH[1]}"
          elif [[ -z "$CURRENT_LATEST" || "$CURRENT_LATEST" == 0.* ]]; then
            LATEST_EPOCH="0"
          else
            echo "::error::Unexpected dist-tags.latest version '${CURRENT_LATEST}' for @ucp-js/sdk"
            exit 1
          fi
          RELEASE_DIST_TAG="release-${YYYY}-${MM}-${DD}"
          if (( 10#$YYYYMMDD >= 10#$LATEST_EPOCH )); then
            npm publish --provenance --access public --tag latest
            npm dist-tag add "@ucp-js/sdk@${EXPECTED_VERSION}" "$RELEASE_DIST_TAG" || \
              echo "::warning::Unable to attach secondary dist-tag ${RELEASE_DIST_TAG}; verify 'Allow npm dist-tag' is enabled on npmjs.com Trusted Publisher"
          else
            npm publish --provenance --access public --tag "$RELEASE_DIST_TAG"
          fi
