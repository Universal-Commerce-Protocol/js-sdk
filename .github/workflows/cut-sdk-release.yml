name: Cut SDK Release

on:
  workflow_dispatch:
    inputs:
      spec_version:
        description: "UCP specification version date (YYYY-MM-DD, >= 2026-08-25)"
        required: true
        type: string
      bump:
        description: "Release version increment type (or publish-existing to tag/release an untagged branch HEAD)"
        required: true
        type: choice
        default: "initial"
        options:
          - initial
          - patch
          - minor
          - publish-existing
      ucp_sha:
        description: "Optional 40-char commit SHA on ucp release/<spec_version> (defaults to branch HEAD)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Create tag v<NEW_VERSION> and publish GitHub Release to trigger npm publish"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cut-sdk-release-${{ inputs.spec_version }}
  cancel-in-progress: false

jobs:
  cut-release:
    name: Cut and tag SDK release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.x"

      - name: Validate inputs, clone UCP spec, and prepare release branch
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
          BUMP: ${{ inputs.bump }}
          INPUT_UCP_SHA: ${{ inputs.ucp_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          if [[ ! "$SPEC_VERSION" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
            echo "::error::spec_version '$SPEC_VERSION' must match YYYY-MM-DD"
            exit 1
          fi
          YYYY="${BASH_REMATCH[1]}"
          MM="${BASH_REMATCH[2]}"
          DD="${BASH_REMATCH[3]}"
          if ! YYYY="$YYYY" MM="$MM" DD="$DD" node -e 'const y=+process.env.YYYY,m=+process.env.MM,d=+process.env.DD,dt=new Date(Date.UTC(y,m-1,d)); process.exit(dt.getUTCFullYear()===y && dt.getUTCMonth()+1===m && dt.getUTCDate()===d ? 0 : 1)'; then
            echo "::error::spec_version '$SPEC_VERSION' is not a valid calendar date"
            exit 1
          fi
          YYYYMMDD="${YYYY}${MM}${DD}"
          if (( 10#$YYYYMMDD < 20260825 )); then
            echo "::error::spec_version '$SPEC_VERSION' must be >= 2026-08-25"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ucp-spec"
          git clone --filter=blob:none --no-checkout https://github.com/Universal-Commerce-Protocol/ucp.git "$RUNNER_TEMP/ucp-spec"
          if ! git -C "$RUNNER_TEMP/ucp-spec" show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
            echo "::error::Upstream branch release/${SPEC_VERSION} does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi

          if [[ -z "$INPUT_UCP_SHA" ]]; then
            RESOLVED_UCP_SHA="$(git -C "$RUNNER_TEMP/ucp-spec" rev-parse "origin/release/${SPEC_VERSION}")"
          else
            if [[ ! "$INPUT_UCP_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::ucp_sha '$INPUT_UCP_SHA' must be a 40-character lowercase hex SHA"
              exit 1
            fi
            if ! git -C "$RUNNER_TEMP/ucp-spec" cat-file -e "${INPUT_UCP_SHA}^{commit}" 2>/dev/null; then
              echo "::error::ucp_sha '$INPUT_UCP_SHA' does not exist in Universal-Commerce-Protocol/ucp"
              exit 1
            fi
            if ! git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$INPUT_UCP_SHA" "origin/release/${SPEC_VERSION}"; then
              echo "::error::ucp_sha '$INPUT_UCP_SHA' is not an ancestor of origin/release/${SPEC_VERSION}"
              exit 1
            fi
            RESOLVED_UCP_SHA="$INPUT_UCP_SHA"
          fi
          git -C "$RUNNER_TEMP/ucp-spec" checkout --quiet "$RESOLVED_UCP_SHA"

          if [[ "$BUMP" == "initial" ]]; then
            if git show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
              echo "::error::Branch release/${SPEC_VERSION} already exists; use bump=patch, bump=minor, or bump=publish-existing"
              exit 1
            fi
            git checkout -B "release/${SPEC_VERSION}" origin/main
            NEW_VERSION="${YYYYMMDD}.0.0"
          elif [[ "$BUMP" == "publish-existing" ]]; then
            if [[ "$PUBLISH_RELEASE" != "true" ]]; then
              echo "::error::bump=publish-existing requires publish_release=true"
              exit 1
            fi
            if ! git show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
              echo "::error::Branch release/${SPEC_VERSION} does not exist; use bump=initial first"
              exit 1
            fi
            git checkout -B "release/${SPEC_VERSION}" "origin/release/${SPEC_VERSION}"
            CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            if [[ ! "$CURRENT_VERSION" =~ ^${YYYYMMDD}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Current package.json version '$CURRENT_VERSION' does not match canonical ${YYYYMMDD}.MINOR.PATCH"
              exit 1
            fi
            LOCK_CHANNEL="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).channel")"
            LOCK_REF="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_ref")"
            LOCK_SHA="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_sha")"
            if [[ "$LOCK_CHANNEL" != "release" || "$LOCK_REF" != "release/${SPEC_VERSION}" || "$LOCK_SHA" != "$RESOLVED_UCP_SHA" ]]; then
              echo "::error::ucp-lock.json on release/${SPEC_VERSION} (channel='${LOCK_CHANNEL}', ucp_ref='${LOCK_REF}', ucp_sha='${LOCK_SHA}') does not match expected release/${SPEC_VERSION} at '${RESOLVED_UCP_SHA}'"
              exit 1
            fi
            NEW_VERSION="$CURRENT_VERSION"
          else
            if ! git show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
              echo "::error::Branch release/${SPEC_VERSION} does not exist; use bump=initial first"
              exit 1
            fi
            git checkout -B "release/${SPEC_VERSION}" "origin/release/${SPEC_VERSION}"
            CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            if [[ ! "$CURRENT_VERSION" =~ ^${YYYYMMDD}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "::error::Current package.json version '$CURRENT_VERSION' does not match canonical ${YYYYMMDD}.MINOR.PATCH"
              exit 1
            fi
            MINOR="${BASH_REMATCH[1]}"
            PATCH="${BASH_REMATCH[2]}"
            if [[ "$BUMP" == "patch" ]]; then
              NEW_VERSION="${YYYYMMDD}.${MINOR}.$((PATCH + 1))"
            elif [[ "$BUMP" == "minor" ]]; then
              NEW_VERSION="${YYYYMMDD}.$((MINOR + 1)).0"
            else
              echo "::error::Unsupported bump '$BUMP'"
              exit 1
            fi
          fi

          TAG_CHECK_RC=0
          git ls-remote --exit-code --tags origin "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1 || TAG_CHECK_RC=$?
          if (( TAG_CHECK_RC == 0 )); then
            echo "::error::Tag v${NEW_VERSION} already exists on origin"
            exit 1
          elif (( TAG_CHECK_RC != 2 )); then
            echo "::error::Failed to query remote tags on origin (exit code ${TAG_CHECK_RC})"
            exit "$TAG_CHECK_RC"
          fi

          UCP_SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_schema_version")"
          if [[ ! "$UCP_SCHEMA_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::ucp-lock.json ucp_schema_version '$UCP_SCHEMA_VERSION' must be a canonical semantic version"
            exit 1
          fi
          {
            echo "YYYYMMDD=${YYYYMMDD}"
            echo "NEW_VERSION=${NEW_VERSION}"
            echo "UCP_SCHEMA_VERSION=${UCP_SCHEMA_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies and ucp-schema
        env:
          UCP_SCHEMA_VERSION: ${{ env.UCP_SCHEMA_VERSION }}
        run: |
          set -euo pipefail
          npm ci
          TMP_BIN="$(mktemp -d)"
          trap 'rm -rf "$TMP_BIN"' EXIT
          curl -fsSL --retry 3 -o "$TMP_BIN/ucp-schema-linux-x86_64" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$TMP_BIN/SHA256SUMS" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Regenerate or verify models and update version
        env:
          BUMP: ${{ inputs.bump }}
          SPEC_VERSION: ${{ inputs.spec_version }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
        run: |
          set -euo pipefail
          if [[ "$BUMP" == "publish-existing" ]]; then
            ./generate_models.sh --from-lock --spec-dir "$RUNNER_TEMP/ucp-spec"
          else
            ./generate_models.sh "$RUNNER_TEMP/ucp-spec" --spec-dir "$RUNNER_TEMP/ucp-spec" --channel release --ref "release/${SPEC_VERSION}" --write-lock
            npm version "$NEW_VERSION" --no-git-tag-version
          fi

      - name: Normalize with repository pre-commit Prettier hook
        uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd # v3.0.1
        continue-on-error: true
        with:
          extra_args: prettier --files src/spec_generated.ts package.json ucp-lock.json
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Build and run unit tests
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          ./node_modules/.bin/prettier --check package.json ucp-lock.json
          if [[ "$BUMP" == "publish-existing" ]] && [[ -n "$(git status --porcelain -- src/spec_generated.ts package.json ucp-lock.json)" ]]; then
            git diff -- src/spec_generated.ts package.json ucp-lock.json || true
            echo "::error::Existing release branch models or manifest differ from lockfile regeneration"
            exit 1
          fi
          npm run build
          npm test

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit, push release branch, and publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          SPEC_VERSION: ${{ inputs.spec_version }}
          YYYYMMDD: ${{ env.YYYYMMDD }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"
          TAG_CHECK_RC=0
          git ls-remote --exit-code --tags "$REMOTE_URL" "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1 || TAG_CHECK_RC=$?
          if (( TAG_CHECK_RC == 0 )); then
            echo "::error::Tag v${NEW_VERSION} already exists on origin"
            exit 1
          elif (( TAG_CHECK_RC != 2 )); then
            echo "::error::Failed to query remote tags on origin (exit code ${TAG_CHECK_RC})"
            exit "$TAG_CHECK_RC"
          fi

          BOT_NAME="${APP_SLUG:-ucp-automation}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          if [[ ! "$BOT_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Failed to resolve numeric GitHub user ID for ${BOT_NAME}"
            exit 1
          fi
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

          if [[ "$BUMP" != "publish-existing" ]]; then
            git add -- ucp-lock.json package.json package-lock.json src/spec_generated.ts
            if git diff --cached --quiet; then
              echo "::error::Expected staged release changes for bump=${BUMP}, but git index had zero diff"
              exit 1
            fi
            git commit -m "chore(release): v${NEW_VERSION}"
            git push "$REMOTE_URL" "HEAD:refs/heads/release/${SPEC_VERSION}"
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            RELEASE_TAGS="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" --jq '.[] | select((.draft | not) and (.prerelease | not)) | .tag_name')"
            LATEST_RELEASE_EPOCH="0"
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^v([0-9]{8})\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
                TAG_EPOCH="${BASH_REMATCH[1]}"
                if (( 10#$TAG_EPOCH > 10#$LATEST_RELEASE_EPOCH )); then
                  LATEST_RELEASE_EPOCH="$TAG_EPOCH"
                fi
              fi
            done <<< "$RELEASE_TAGS"

            if (( 10#$YYYYMMDD < 10#$LATEST_RELEASE_EPOCH )); then
              MAKE_LATEST_FLAG="--latest=false"
            else
              MAKE_LATEST_FLAG="--latest"
            fi

            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push "$REMOTE_URL" "refs/tags/v${NEW_VERSION}"
            gh release create "v${NEW_VERSION}" \
              --repo "$REPOSITORY" \
              --verify-tag \
              "$MAKE_LATEST_FLAG" \
              --title "v${NEW_VERSION}" \
              --generate-notes
          fi
