name: Cut SDK Release

on:
  workflow_dispatch:
    inputs:
      spec_version:
        description: "UCP specification version date (YYYY-MM-DD, >= 2026-10-01)"
        required: true
        type: string
      bump:
        description: "Release version increment type"
        required: true
        type: choice
        default: "initial"
        options:
          - initial
          - patch
          - minor
      ucp_sha:
        description: "Optional 40-char commit SHA on ucp release/<spec_version> (defaults to branch HEAD)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Create tag v<NEW_VERSION> and publish GitHub Release to trigger npm publish"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  cut-release:
    name: Cut and tag SDK release
    runs-on: ubuntu-latest
    steps:
      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"

      - name: Validate inputs, clone UCP spec, and prepare release branch
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
          BUMP: ${{ inputs.bump }}
          INPUT_UCP_SHA: ${{ inputs.ucp_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$SPEC_VERSION" =~ ^([0-9]{4})-([0-9]{2})-([0-9]{2})$ ]]; then
            echo "::error::spec_version '$SPEC_VERSION' must match YYYY-MM-DD"
            exit 1
          fi
          YYYY="${BASH_REMATCH[1]}"
          MM="${BASH_REMATCH[2]}"
          DD="${BASH_REMATCH[3]}"
          YYYYMMDD="${YYYY}${MM}${DD}"
          if (( 10#$YYYYMMDD < 20261001 )); then
            echo "::error::spec_version '$SPEC_VERSION' must be >= 2026-10-01"
            exit 1
          fi

          rm -rf "$RUNNER_TEMP/ucp-spec"
          git clone https://github.com/Universal-Commerce-Protocol/ucp.git "$RUNNER_TEMP/ucp-spec"
          if ! git -C "$RUNNER_TEMP/ucp-spec" show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
            echo "::error::Upstream branch release/${SPEC_VERSION} does not exist in Universal-Commerce-Protocol/ucp"
            exit 1
          fi

          if [[ -z "$INPUT_UCP_SHA" ]]; then
            RESOLVED_UCP_SHA="$(git -C "$RUNNER_TEMP/ucp-spec" rev-parse "origin/release/${SPEC_VERSION}")"
          else
            if [[ ! "$INPUT_UCP_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::ucp_sha '$INPUT_UCP_SHA' must be a 40-character lowercase hex SHA"
              exit 1
            fi
            if ! git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$INPUT_UCP_SHA" "origin/release/${SPEC_VERSION}"; then
              echo "::error::ucp_sha '$INPUT_UCP_SHA' is not an ancestor of origin/release/${SPEC_VERSION}"
              exit 1
            fi
            RESOLVED_UCP_SHA="$INPUT_UCP_SHA"
          fi
          git -C "$RUNNER_TEMP/ucp-spec" checkout --quiet "$RESOLVED_UCP_SHA"

          if [[ "$BUMP" == "initial" ]]; then
            if git show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
              echo "::error::Branch release/${SPEC_VERSION} already exists; use bump=patch or bump=minor"
              exit 1
            fi
            git checkout -B "release/${SPEC_VERSION}" origin/main
            NEW_VERSION="${YYYYMMDD}.0.0"
          else
            if ! git show-ref --verify --quiet "refs/remotes/origin/release/${SPEC_VERSION}"; then
              echo "::error::Branch release/${SPEC_VERSION} does not exist; use bump=initial first"
              exit 1
            fi
            git checkout -B "release/${SPEC_VERSION}" "origin/release/${SPEC_VERSION}"
            CURRENT_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")"
            if [[ ! "$CURRENT_VERSION" =~ ^${YYYYMMDD}\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "::error::Current package.json version '$CURRENT_VERSION' does not match ${YYYYMMDD}.MINOR.PATCH"
              exit 1
            fi
            MINOR="${BASH_REMATCH[1]}"
            PATCH="${BASH_REMATCH[2]}"
            if [[ "$BUMP" == "patch" ]]; then
              NEW_VERSION="${YYYYMMDD}.${MINOR}.$((PATCH + 1))"
            elif [[ "$BUMP" == "minor" ]]; then
              NEW_VERSION="${YYYYMMDD}.$((MINOR + 1)).0"
            else
              echo "::error::Unsupported bump '$BUMP'"
              exit 1
            fi
          fi

          UCP_SCHEMA_VERSION="$(node -p "JSON.parse(require('fs').readFileSync('ucp-lock.json', 'utf8')).ucp_schema_version")"
          {
            echo "NEW_VERSION=${NEW_VERSION}"
            echo "UCP_SCHEMA_VERSION=${UCP_SCHEMA_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Install dependencies and ucp-schema
        env:
          UCP_SCHEMA_VERSION: ${{ env.UCP_SCHEMA_VERSION }}
        run: |
          set -euo pipefail
          npm ci
          TMP_BIN="$(mktemp -d)"
          curl -fsSL -o "$TMP_BIN/ucp-schema-linux-x86_64" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/ucp-schema-linux-x86_64"
          curl -fsSL -o "$TMP_BIN/SHA256SUMS" \
            "https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          mkdir -p "$HOME/.local/bin"
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$HOME/.local/bin/ucp-schema"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          rm -rf "$TMP_BIN"

      - name: Regenerate models, update version, verify, and publish release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          SPEC_VERSION: ${{ inputs.spec_version }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          ./generate_models.sh "$RUNNER_TEMP/ucp-spec" --channel release --ref "release/${SPEC_VERSION}" --write-lock
          npm version "$NEW_VERSION" --no-git-tag-version
          ./node_modules/.bin/prettier --write package.json ucp-lock.json
          npm test
          npm run build

          BOT_NAME="${APP_SLUG:-ucp-automation}[bot]"
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_NAME}@users.noreply.github.com"
          git add -- ucp-lock.json package.json package-lock.json src/spec_generated.ts
          git commit -m "chore(release): v${NEW_VERSION}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "HEAD:refs/heads/release/${SPEC_VERSION}"

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push "https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git" "refs/tags/v${NEW_VERSION}"
            gh release create "v${NEW_VERSION}" \
              --repo "$REPOSITORY" \
              --target "release/${SPEC_VERSION}" \
              --title "v${NEW_VERSION}" \
              --generate-notes
          fi
