name: Cut SDK Release

on:
  workflow_dispatch:
    inputs:
      spec_version:
        description: "UCP specification version date (YYYY-MM-DD, >= 2026-08-25)"
        required: true
        type: string
      bump:
        description: "Release version increment type (or publish-existing to tag/release an untagged branch HEAD)"
        required: true
        type: choice
        default: "initial"
        options:
          - initial
          - patch
          - minor
          - publish-existing
      ucp_sha:
        description: "Optional 40-char commit SHA on ucp release/<spec_version> (defaults to branch HEAD)"
        required: false
        default: ""
        type: string
      publish_release:
        description: "Create tag v<NEW_VERSION> and publish GitHub Release to trigger npm publish"
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: cut-sdk-release-${{ inputs.spec_version }}
  cancel-in-progress: false

jobs:
  cut-release:
    name: Cut and tag SDK release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout js-sdk
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "lts/*"
          package-manager-cache: false

      - name: Prepare, regenerate, and verify release
        env:
          SPEC_VERSION: ${{ inputs.spec_version }}
          BUMP: ${{ inputs.bump }}
          INPUT_UCP_SHA: ${{ inputs.ucp_sha }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }

          [[ "$SPEC_VERSION" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ && "$(date -u -d "$SPEC_VERSION" +%Y-%m-%d 2>/dev/null || true)" == "$SPEC_VERSION" ]] \
            || die "spec_version '$SPEC_VERSION' must be a valid YYYY-MM-DD calendar date"
          YYYYMMDD="${SPEC_VERSION//-/}"
          (( 10#$YYYYMMDD >= 20260825 )) || die "spec_version '$SPEC_VERSION' must be >= 2026-08-25"
          REL_BRANCH="release/${SPEC_VERSION}"

          rm -rf "$RUNNER_TEMP/ucp-spec"
          git clone --filter=blob:none --no-checkout https://github.com/Universal-Commerce-Protocol/ucp.git "$RUNNER_TEMP/ucp-spec"
          git -C "$RUNNER_TEMP/ucp-spec" show-ref --verify --quiet "refs/remotes/origin/${REL_BRANCH}" \
            || die "Upstream branch ${REL_BRANCH} does not exist in Universal-Commerce-Protocol/ucp"

          if [[ -z "$INPUT_UCP_SHA" ]]; then
            RESOLVED_UCP_SHA="$(git -C "$RUNNER_TEMP/ucp-spec" rev-parse "origin/${REL_BRANCH}")"
          else
            [[ "$INPUT_UCP_SHA" =~ ^[0-9a-f]{40}$ ]] || die "ucp_sha '$INPUT_UCP_SHA' must be a 40-char lowercase hex SHA"
            git -C "$RUNNER_TEMP/ucp-spec" cat-file -e "${INPUT_UCP_SHA}^{commit}" 2>/dev/null || die "ucp_sha '$INPUT_UCP_SHA' not found in ucp"
            git -C "$RUNNER_TEMP/ucp-spec" merge-base --is-ancestor "$INPUT_UCP_SHA" "origin/${REL_BRANCH}" \
              || die "ucp_sha '$INPUT_UCP_SHA' is not an ancestor of origin/${REL_BRANCH}"
            RESOLVED_UCP_SHA="$INPUT_UCP_SHA"
          fi
          git -C "$RUNNER_TEMP/ucp-spec" checkout --quiet "$RESOLVED_UCP_SHA"

          if [[ "$BUMP" == "initial" ]]; then
            ! git show-ref --verify --quiet "refs/remotes/origin/${REL_BRANCH}" \
              || die "Branch ${REL_BRANCH} already exists; use bump=patch, minor, or publish-existing"
            git checkout -B "$REL_BRANCH" origin/main
            NEW_VERSION="${YYYYMMDD}.0.0"
          else
            git show-ref --verify --quiet "refs/remotes/origin/${REL_BRANCH}" || die "Branch ${REL_BRANCH} does not exist; use bump=initial first"
            git checkout -B "$REL_BRANCH" "origin/${REL_BRANCH}"
            CURRENT_VERSION="$(jq -er '.version' package.json)"
            [[ "$CURRENT_VERSION" =~ ^${YYYYMMDD}\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
              || die "package.json version '$CURRENT_VERSION' does not match canonical ${YYYYMMDD}.MINOR.PATCH"
            MINOR="${BASH_REMATCH[1]}"
            PATCH="${BASH_REMATCH[2]}"
            case "$BUMP" in
              publish-existing)
                [[ "$PUBLISH_RELEASE" == "true" ]] || die "bump=publish-existing requires publish_release=true"
                jq -e --arg ref "$REL_BRANCH" --arg sha "$RESOLVED_UCP_SHA" \
                  '.channel == "release" and .ucp_ref == $ref and .ucp_sha == $sha' ucp-lock.json >/dev/null \
                  || die "ucp-lock.json on ${REL_BRANCH} does not match ${REL_BRANCH} at ${RESOLVED_UCP_SHA}"
                NEW_VERSION="$CURRENT_VERSION"
                ;;
              patch) NEW_VERSION="${YYYYMMDD}.${MINOR}.$((PATCH + 1))" ;;
              minor) NEW_VERSION="${YYYYMMDD}.$((MINOR + 1)).0" ;;
              *) die "Unsupported bump '$BUMP'" ;;
            esac
          fi

          TAG_RC=0
          git ls-remote --exit-code --tags origin "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1 || TAG_RC=$?
          if (( TAG_RC == 0 )); then die "Tag v${NEW_VERSION} already exists on origin"; fi
          (( TAG_RC == 2 )) || die "Failed to query remote tags on origin (exit code ${TAG_RC})"

          UCP_SCHEMA_VERSION="$(jq -er '.ucp_schema_version | select(type == "string" and test("^[0-9]+\\.[0-9]+\\.[0-9]+$"))' ucp-lock.json)" \
            || die "Invalid ucp_schema_version in ucp-lock.json"

          npm ci
          TMP_BIN="$(mktemp -d)"
          trap 'rm -rf "$TMP_BIN"' EXIT
          BASE_URL="https://github.com/Universal-Commerce-Protocol/ucp-schema/releases/download/v${UCP_SCHEMA_VERSION}"
          curl -fsSL --retry 3 -o "$TMP_BIN/ucp-schema-linux-x86_64" "$BASE_URL/ucp-schema-linux-x86_64"
          curl -fsSL --retry 3 -o "$TMP_BIN/SHA256SUMS" "$BASE_URL/SHA256SUMS"
          (cd "$TMP_BIN" && sha256sum -c --ignore-missing SHA256SUMS)
          install -m 0755 "$TMP_BIN/ucp-schema-linux-x86_64" "$TMP_BIN/ucp-schema"

          if [[ "$BUMP" == "publish-existing" ]]; then
            UCP_SCHEMA_BIN="$TMP_BIN/ucp-schema" ./generate_models.sh --from-lock --spec-dir "$RUNNER_TEMP/ucp-spec"
          else
            UCP_SCHEMA_BIN="$TMP_BIN/ucp-schema" ./generate_models.sh --spec-dir "$RUNNER_TEMP/ucp-spec" --channel release --ref "$REL_BRANCH" --write-lock
            npm version "$NEW_VERSION" --no-git-tag-version
          fi

          PRE_COMMIT=(pipx run pre-commit)
          if command -v uvx >/dev/null 2>&1; then PRE_COMMIT=(uvx pre-commit); fi
          "${PRE_COMMIT[@]}" run prettier --files src/spec_generated.ts package.json ucp-lock.json || \
            "${PRE_COMMIT[@]}" run prettier --files src/spec_generated.ts package.json ucp-lock.json
          ./node_modules/.bin/prettier --check package.json ucp-lock.json

          if [[ "$BUMP" == "publish-existing" && -n "$(git status --porcelain -- src/spec_generated.ts package.json ucp-lock.json)" ]]; then
            git diff -- src/spec_generated.ts package.json ucp-lock.json || true
            die "Existing release branch models or manifest differ from lockfile regeneration"
          fi

          npm run build
          npm test
          {
            echo "YYYYMMDD=${YYYYMMDD}"
            echo "NEW_VERSION=${NEW_VERSION}"
          } >> "$GITHUB_ENV"

      - name: Generate GitHub App Token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      - name: Commit, push release branch, and publish GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPOSITORY: ${{ github.repository }}
          BUMP: ${{ inputs.bump }}
          SPEC_VERSION: ${{ inputs.spec_version }}
          YYYYMMDD: ${{ env.YYYYMMDD }}
          NEW_VERSION: ${{ env.NEW_VERSION }}
          PUBLISH_RELEASE: ${{ inputs.publish_release }}
        run: |
          set -euo pipefail
          die() { echo "::error::$*"; exit 1; }
          REMOTE_URL="https://x-access-token:${GH_TOKEN}@github.com/${REPOSITORY}.git"

          TAG_RC=0
          git ls-remote --exit-code --tags "$REMOTE_URL" "refs/tags/v${NEW_VERSION}" >/dev/null 2>&1 || TAG_RC=$?
          if (( TAG_RC == 0 )); then die "Tag v${NEW_VERSION} already exists on origin"; fi
          (( TAG_RC == 2 )) || die "Failed to query remote tags on origin (exit code ${TAG_RC})"

          BOT_NAME="${APP_SLUG:-ucp-automation}[bot]"
          BOT_ID="$(gh api "/users/${BOT_NAME}" --jq .id)"
          [[ "$BOT_ID" =~ ^[0-9]+$ ]] || die "Failed to resolve numeric GitHub user ID for ${BOT_NAME}"
          git config user.name "$BOT_NAME"
          git config user.email "${BOT_ID}+${BOT_NAME}@users.noreply.github.com"

          if [[ "$BUMP" == "publish-existing" ]]; then
            REMOTE_HEAD="$(git ls-remote --heads "$REMOTE_URL" "refs/heads/release/${SPEC_VERSION}" | awk '{print $1}')"
            [[ "$REMOTE_HEAD" == "$(git rev-parse HEAD)" ]] || die "Remote branch release/${SPEC_VERSION} moved during verification"
          else
            git add -- ucp-lock.json package.json package-lock.json src/spec_generated.ts
            ! git diff --cached --quiet || die "Expected staged release changes for bump=${BUMP}, but git index had zero diff"
            git commit -m "chore(release): v${NEW_VERSION}"
            git push "$REMOTE_URL" "HEAD:refs/heads/release/${SPEC_VERSION}"
          fi

          if [[ "$PUBLISH_RELEASE" == "true" ]]; then
            LATEST_EPOCH="$(gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" | jq -sr '
              [.[][] | select((.draft | not) and (.prerelease | not)) | .tag_name
               | capture("^v(?<e>[0-9]{8})\\.(0|[1-9][0-9]*)\\.(0|[1-9][0-9]*)$").e | tonumber] | max // 0
            ')"
            MAKE_LATEST_FLAG="--latest"
            if (( 10#$YYYYMMDD < 10#$LATEST_EPOCH )); then MAKE_LATEST_FLAG="--latest=false"; fi

            git tag -a "v${NEW_VERSION}" -m "Release v${NEW_VERSION}"
            git push "$REMOTE_URL" "refs/tags/v${NEW_VERSION}"
            gh release create "v${NEW_VERSION}" --repo "$REPOSITORY" --verify-tag "$MAKE_LATEST_FLAG" \
              --title "v${NEW_VERSION}" --generate-notes
          fi
